<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101411">
<meta name="description" content="Meu Treino — sua ficha de academia no celular.">
<title>Meu Treino</title>
<style>
:root{--bg:#101411;--panel:#1a211d;--panel2:#222b25;--text:#f3f7f3;--muted:#a5b1a8;--line:#303b33;--accent:#9be36b;--accent2:#c5f3a7;--danger:#ff7777;--shadow:0 12px 32px #0005}
body.light{--bg:#f3f6f2;--panel:#fff;--panel2:#edf2ec;--text:#172019;--muted:#627064;--line:#dce5dc;--accent:#397d27;--accent2:#285e1b;--danger:#c33}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:92px;transition:.2s}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.top{max-width:760px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.4px}.logo{width:38px;height:38px;border-radius:13px;background:var(--accent);color:#152013;display:grid;place-items:center;font-size:21px}.top-actions{display:flex;gap:8px}.iconbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);width:40px;height:40px;border-radius:13px;font-size:18px}
main{padding-top:22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}.hero h1{font-size:28px;line-height:1.1;margin:6px 0 4px}.sub{color:var(--muted);font-size:13px}.date{color:var(--muted);font-size:12px;text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.today{background:linear-gradient(135deg,#263b29,#19231d);border:1px solid #496849;color:#f3fff0}.today .eyebrow{color:#b9f59a}.today h2{margin:7px 0;font-size:21px}.today p{color:#c7d8c7;margin:0;font-size:13px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.linkbtn{background:none;color:var(--accent);font-weight:750;padding:6px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day{padding:10px 4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--muted);text-align:center;font-size:12px}.day b{display:block;color:var(--text);font-size:13px;margin-bottom:3px}.day.active{background:var(--accent);color:#172313;border-color:var(--accent)}.day.active b{color:#172313}
.exercise{display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.photo{width:82px;height:82px;border-radius:15px;background:var(--panel2);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11px;padding:5px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.exercise h3{font-size:14px;margin:0 0 3px}.exercise p{font-size:12px;color:var(--muted);margin:0 0 5px}.tag{display:inline-block;background:var(--panel2);color:var(--accent);border-radius:20px;padding:3px 8px;font-size:10px;font-weight:750}.check{width:28px;height:28px;border:1.5px solid var(--muted);border-radius:50%;background:transparent;color:#142012}.check.done{background:var(--accent);border-color:var(--accent)}
.primary{background:var(--accent);color:#142012;border-radius:13px;padding:12px 16px;font-weight:850}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:10px 13px;font-weight:700}.wide{width:100%}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.progress{height:7px;border-radius:10px;background:#52605266;overflow:hidden;margin-top:13px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
.timer{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;margin-top:14px}.timer small{color:var(--muted);font-weight:750;letter-spacing:1px}.time{font-size:48px;font-weight:900;letter-spacing:2px;line-height:1.25;font-variant-numeric:tabular-nums}.timer-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.paneltitle{font-size:18px;margin:0 0 5px}.muted{color:var(--muted)}.hidden{display:none!important}
.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:none;color:var(--muted);padding:6px 2px;border-radius:12px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:var(--accent);background:var(--panel2)}
.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.exercise-detail{padding:15px;border-radius:16px;background:var(--panel2);margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);padding:12px;border-radius:14px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.modalback{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:end center;padding:12px}.modal{width:min(100%,600px);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.toast{position:fixed;z-index:30;bottom:100px;left:50%;transform:translateX(-50%);background:var(--accent);color:#152013;padding:10px 15px;border-radius:30px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
@media(min-width:650px){.app{padding:0 24px}main{padding-top:30px}.hero h1{font-size:34px}.days{gap:10px}.day{padding:14px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><div class="logo">✦</div><span>MEU TREINO</span></div><div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Alternar tema">☼</button><button class="iconbtn" id="settingsBtn" aria-label="Configurações">⚙</button></div></div></header>
<div class="app"><main id="view"></main></div>
<nav class="bottom"><div class="nav">
<button class="active" data-page="home"><span>⌂</span>Início</button>
<button data-page="routine"><span>▦</span>Rotina</button>
<button data-page="exercises"><span>🏋</span>Exercícios</button>
<button data-page="history"><span>▤</span>Histórico</button>
</div></nav>
<div id="modalRoot"></div>
<script>
const DAYS=[
 {id:'mon',short:'SEG',name:'Segunda',title:'Peito, ombro e tríceps',items:[
  ['Supino inclinado','Peito','Supino inclinado',''],['Crucifixo','Peito','Crucifixo',''],['Supino reto na máquina','Peito','Supino reto',''],['Desenvolvimento de ombro','Ombros','Desenvolvimento',''],['Elevação lateral','Ombros','Elevação lateral',''],['Elevação frontal na polia com corda','Ombros','Elevação frontal',''],['Tríceps na polia com corda','Tríceps','Tríceps corda','']]},
 {id:'tue',short:'TER',name:'Terça',title:'Bíceps e costas',items:[
  ['Rosca com halteres ou máquina','Bíceps','Rosca bíceps',''],['Puxada alta na polia','Costas','Puxada alta',''],['Remada','Costas','Remada','']]},
 {id:'wed',short:'QUA',name:'Quarta',title:'Cardio e abdômen',items:[
  ['Corrida','Cardio','Esteira',''],['Abdominal','Abdômen','Abdominal',''],['Remador','Abdômen','Remador','']]},
 {id:'thu',short:'QUI',name:'Quinta',title:'Pernas',items:[]},
 {id:'fri',short:'SEX',name:'Sexta',title:'Superior completo',items:[
  ['Exercício de peito','Peito','Peito',''],['Exercício de costas','Costas','Costas',''],['Exercício de ombros','Ombros','Ombros',''],['Exercício de bíceps','Bíceps','Bíceps',''],['Exercício de tríceps','Tríceps','Tríceps','']]}
];
const defaultData={theme:'dark',rest:60,cardio:25,plans:{},logs:[],loads:{}};
let data={...defaultData,...JSON.parse(localStorage.getItem('meutreino-data')||'{}')};
let page='home',selectedDay=new Date().getDay(),timer=null,remaining=Number(data.rest)||60,running=false,completed={};
function save(){localStorage.setItem('meutreino-data',JSON.stringify(data))}
function theme(){document.body.classList.toggle('light',data.theme==='light');document.querySelector('meta[name="theme-color"]').content=data.theme==='light'?'#f3f6f2':'#101411';document.getElementById('themeBtn').textContent=data.theme==='light'?'☾':'☼'}
function dayIndex(){let n=new Date().getDay();return n===0?0:n-1}
function getItems(d){return data.plans[d.id]||d.items}
function allItems(d){return getItems(d)}
function todayCard(){let d=DAYS[dayIndex()];return d}
function progress(d){let a=getItems(d),done=a.filter((_,i)=>completed[d.id+'-'+i]).length;return {done,total:a.length}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 theme();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const v=document.getElementById('view');
 if(page==='home')v.innerHTML=homeHTML();
 if(page==='routine')v.innerHTML=routineHTML();
 if(page==='exercises')v.innerHTML=exercisesHTML();
 if(page==='history')v.innerHTML=historyHTML();
}
function homeHTML(){let d=todayCard(),p=progress(d),pct=p.total?Math.round(p.done/p.total*100):0;
return `<div class="hero"><div><div class="eyebrow">SEU ESPAÇO DE TREINO</div><h1>Vamos treinar? 💪</h1><div class="sub">Um passo de cada vez. Registre sua evolução.</div></div><div class="date">${new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}</div></div>
<div class="card today"><div class="eyebrow">TREINO DE HOJE</div><h2>${d.title}</h2><p>${p.total} exercícios cadastrados · ${p.done} concluídos</p><div class="progress"><span style="width:${pct}%"></span></div><div class="row between" style="margin-top:12px"><small>${pct}% concluído</small><button class="primary" onclick="openDay('${d.id}')">Abrir treino →</button></div></div>
<div class="sectionhead"><h2>Minha semana</h2><button class="linkbtn" onclick="go('routine')">Ver rotina</button></div>
<div class="days">${DAYS.map((x,i)=>`<button class="day ${i===dayIndex()?'active':''}" onclick="openDay('${x.id}')"><b>${x.short}</b>${x.items.length+(data.plans[x.id]?.length||0)} itens</button>`).join('')}</div>
<div class="sectionhead"><h2>Resumo</h2></div><div class="stats"><div class="stat"><strong>${DAYS.length}</strong><span>Dias planejados</span></div><div class="stat"><strong>${data.logs.length}</strong><span>Treinos salvos</span></div><div class="stat"><strong>${data.cardio} min</strong><span>Cardio sugerido</span></div></div>
<div class="sectionhead"><h2>Descanso entre séries</h2></div>${timerHTML()}`}
function routineHTML(){return `<div class="hero"><div><div class="eyebrow">PLANEJAMENTO</div><h1>Minha rotina</h1><div class="sub">Toque em um dia para ver ou editar a ficha.</div></div></div>${DAYS.map(d=>`<div class="card"><div class="row between"><div><div class="eyebrow">${d.name.toUpperCase()}</div><h2 class="paneltitle">${d.title}</h2><div class="sub">${getItems(d).length} exercícios</div></div><button class="primary" onclick="openDay('${d.id}')">Abrir</button></div></div>`).join('')}`}
function exercisesHTML(){let flat=DAYS.flatMap(d=>getItems(d).map((x,i)=>({x,d,i})));return `<div class="hero"><div><div class="eyebrow">BIBLIOTECA</div><h1>Exercícios</h1><div class="sub">Fotos e detalhes serão associados conforme você confirmar os aparelhos.</div></div></div>${flat.map(({x,d,i})=>`<div class="exercise"><div class="photo">Foto do aparelho<br>a adicionar</div><div><h3>${esc(x[0])}</h3><p>${esc(x[1])} · ${d.name}</p><span class="tag">${esc(x[2])}</span></div><button class="check" onclick="editExercise('${d.id}',${i})">✎</button></div>`).join('')}`}
function historyHTML(){return `<div class="hero"><div><div class="eyebrow">ACOMPANHAMENTO</div><h1>Histórico</h1><div class="sub">Seus registros de treino e cargas.</div></div></div>${data.logs.length?data.logs.slice().reverse().map(l=>`<div class="card"><div class="row between"><b>${esc(l.day)}</b><small class="muted">${esc(l.date)}</small></div><p class="sub">${l.done} exercícios concluídos</p></div>`).join(''):'<div class="card muted">Seus treinos concluídos aparecerão aqui. Ao finalizar uma ficha, toque em “Salvar treino”.</div>'}<div class="card"><h3 class="paneltitle">Cargas registradas</h3>${Object.keys(data.loads).length?Object.entries(data.loads).map(([k,v])=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(k)}</span><b>${esc(v)} kg</b></div>`).join(''):'<p class="sub">Ainda não há cargas registradas.</p>'}</div>`}
function timerHTML(){return `<div class="timer"><small>CRONÔMETRO DE DESCANSO</small><div class="time" id="timeDisplay">${fmt(remaining)}</div><div class="sub" id="timerStatus">${running?'Descansando...':'Pronto para iniciar'}</div><div class="timer-controls"><button class="secondary" onclick="adjust(-15)">−15s</button><button class="primary" id="timerToggle" onclick="toggleTimer()">${running?'Pausar':'Iniciar'}</button><button class="secondary" onclick="adjust(15)">+15s</button><button class="secondary" onclick="resetTimer()">Zerar</button></div></div>`}
function dayView(id){let d=DAYS.find(x=>x.id===id),items=getItems(d),p=progress(d);return `<div class="hero"><div><div class="eyebrow">${d.name.toUpperCase()}</div><h1>${d.title}</h1><div class="sub">${items.length} exercícios · cardio pós-treino: ${data.cardio} min</div></div><button class="secondary" onclick="go('routine')">Voltar</button></div><div class="card"><div class="row between"><b>Progresso do treino</b><b>${p.done}/${p.total}</b></div><div class="progress"><span style="width:${p.total?p.done/p.total*100:0}%"></span></div></div>${items.map((x,i)=>`<div class="card"><div class="exercise"><div class="photo">Foto do aparelho<br>a adicionar</div><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><span class="tag">${esc(x[2])}</span></div><button class="check ${completed[id+'-'+i]?'done':''}" onclick="completeSet('${id}',${i})">${completed[id+'-'+i]?'✓':'○'}</button></div><div class="exercise-detail"><div class="row between"><b>Ficha do exercício</b><button class="linkbtn" onclick="editExercise('${id}',${i})">Editar</button></div><div class="row" style="gap:14px;flex-wrap:wrap;margin-top:8px"><span class="sub">Séries: ${x[3]||'definir'}</span><span class="sub">Repetições: ${x[4]||'definir'}</span><span class="sub">Descanso: ${x[5]||data.rest}s</span></div><div class="field"><label>Carga utilizada (kg)</label><input inputmode="decimal" placeholder="Ex.: 20" value="${esc(data.loads[x[0]]||'')}" onchange="setLoad('${esc(x[0])}',this.value)"></div><button class="secondary wide" onclick="startRest(${Number(x[5]||data.rest)})">Concluir série e iniciar descanso</button></div></div>`).join('')}${timerHTML()}<button class="primary wide" style="margin:14px 0" onclick="saveWorkout('${id}')">Salvar treino concluído</button><button class="secondary wide" onclick="addExercise('${id}')">+ Adicionar exercício</button>`}
function openDay(id){document.getElementById('view').innerHTML=dayView(id);page='day';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))}
function go(p){page=p;render()}
function completeSet(id,i){let k=id+'-'+i;completed[k]=!completed[k];openDay(id)}
function setLoad(n,v){data.loads[n]=v;save()}
function editExercise(id,i){let d=DAYS.find(x=>x.id===id),x=getItems(d)[i];showModal(`<h2 class="paneltitle">Editar exercício</h2><div class="field"><label>Nome</label><input id="eName" value="${esc(x[0])}"></div><div class="field"><label>Grupo muscular</label><input id="eMuscle" value="${esc(x[1])}"></div><div class="field"><label>Séries</label><input id="eSets" type="number" min="1" value="${x[3]||''}" placeholder="Ex.: 3"></div><div class="field"><label>Repetições</label><input id="eReps" value="${x[4]||''}" placeholder="Ex.: 10 a 12"></div><div class="field"><label>Descanso (segundos)</label><input id="eRest" type="number" min="0" value="${x[5]||data.rest}"></div><div class="row"><button class="primary" onclick="saveExercise('${id}',${i})">Salvar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`)}
function saveExercise(id,i){let d=DAYS.find(x=>x.id===id),a=getItems(d);a[i]=[val('eName'),val('eMuscle'),a[i][2],val('eSets'),val('eReps'),val('eRest')];data.plans[id]=a;save();closeModal();openDay(id);toast('Exercício atualizado')}
function addExercise(id){showModal(`<h2 class="paneltitle">Adicionar exercício</h2><div class="field"><label>Nome do exercício</label><input id="newName" placeholder="Ex.: Cadeira extensora"></div><div class="field"><label>Grupo muscular</label><input id="newMuscle" placeholder="Ex.: Quadríceps"></div><div class="field"><label>Séries</label><input id="newSets" type="number" placeholder="Ex.: 3"></div><div class="field"><label>Repetições</label><input id="newReps" placeholder="Ex.: 12"></div><div class="row"><button class="primary" onclick="saveNewExercise('${id}')">Adicionar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`)}
function saveNewExercise(id){let name=val('newName');if(!name.trim()){toast('Informe o nome');return}let d=DAYS.find(x=>x.id===id),a=[...getItems(d)];a.push([name,val('newMuscle')||'A definir',name,val('newSets'),val('newReps'),data.rest]);data.plans[id]=a;save();closeModal();openDay(id)}
function saveWorkout(id){let d=DAYS.find(x=>x.id===id),p=progress(d);data.logs.push({day:d.title,date:new Date().toLocaleString('pt-BR'),done:p.done});save();toast('Treino salvo no histórico');}
function showModal(s){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function val(id){return document.getElementById(id)?.value||''}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function drawTimer(){let el=document.getElementById('timeDisplay');if(el)el.textContent=fmt(remaining);let s=document.getElementById('timerStatus');if(s)s.textContent=running?'Descansando...':remaining===0?'Descanso finalizado!':'Pronto para iniciar';let b=document.getElementById('timerToggle');if(b)b.textContent=running?'Pausar':'Iniciar'}
function toggleTimer(){if(running){clearInterval(timer);running=false}else{if(remaining<=0)remaining=data.rest;running=true;timer=setInterval(()=>{remaining--;drawTimer();if(remaining<=0){clearInterval(timer);running=false;beep();drawTimer();toast('Descanso finalizado!');if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}drawTimer()}
function startRest(n){clearInterval(timer);running=false;remaining=Math.max(0,n||data.rest);toggleTimer();let el=document.querySelector('.timer');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
function resetTimer(){clearInterval(timer);running=false;remaining=data.rest;drawTimer()}
function adjust(n){remaining=Math.max(0,remaining+n);drawTimer()}
function beep(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),1800)}
function settings(){showModal(`<h2 class="paneltitle">Configurações</h2><div class="field"><label>Tema</label><select id="themeSelect"><option value="dark" ${data.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${data.theme==='light'?'selected':''}>Claro</option></select></div><div class="field"><label>Descanso padrão (segundos)</label><select id="restSelect">${[30,45,60,90,120].map(n=>`<option ${data.rest===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Cardio após o treino (minutos)</label><select id="cardioSelect">${[20,25,30].map(n=>`<option ${data.cardio===n?'selected':''}>${n}</option>`).join('')}</select></div><button class="primary wide" onclick="saveSettings()">Salvar configurações</button><button class="secondary wide" style="margin-top:8px" onclick="exportData()">Exportar meus dados (JSON)</button><p class="sub">Os dados ficam salvos neste navegador e neste dispositivo.</p><button class="secondary wide" onclick="closeModal()">Fechar</button>`)}
function saveSettings(){data.theme=val('themeSelect');data.rest=Number(val('restSelect'));data.cardio=Number(val('cardioSelect'));remaining=data.rest;save();closeModal();render();toast('Configurações salvas')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-treino-backup.json';a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('themeBtn').addEventListener('click',()=>{data.theme=data.theme==='dark'?'light':'dark';save();theme()});
document.getElementById('settingsBtn').addEventListener('click',settings);
render();
</script>
</body></html>
